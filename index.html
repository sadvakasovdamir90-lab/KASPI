<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --kaspi-red: #f14635;
            --gold: #ffcc00;
        }

        body { 
            background: transparent; 
            margin: 0; padding: 0; 
            display: flex; align-items: center; justify-content: center;
            width: 100vw; height: 100vh;
            font-family: 'Russo One', sans-serif;
            overflow: hidden;
        }

        .kaspi-wrapper {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px; /* Арасы жинақы */
        }

        /* КАСПИ НӨМІРІ - ЖИНАҚЫ РАЗМЕР */
        .number-glow {
            font-size: 55px; /* Оңтайлы размер */
            color: #fff;
            letter-spacing: 3px;
            text-shadow: 
                0 0 10px var(--kaspi-red),
                0 0 20px var(--kaspi-red);
            animation: pulseRed 2s infinite alternate;
            line-height: 1;
        }

        /* АСТЫНДАҒЫ ЖАЗУ - СТИЛЬДІ ӘРІ АНЫҚ */
        .sub-text {
            font-size: 24px; /* Тым үлкен емес, тым кіші емес */
            color: var(--gold);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
            opacity: 0.95;
        }

        /* ЖАЙЛЫ ПУЛЬСАЦИЯ */
        @keyframes pulseRed {
            from { text-shadow: 0 0 10px var(--kaspi-red), 0 0 20px var(--kaspi-red); }
            to { text-shadow: 0 0 15px var(--kaspi-red), 0 0 30px var(--kaspi-red), 0 0 40px var(--kaspi-red); }
        }
    </style>
</head>
<body>

    <div class="kaspi-wrapper">
        <div class="number-glow">4400 4303 9900 8140</div>
        
        <div class="sub-text">KASPI GOLD • ДАМИР С.</div>
    </div>

</body>
</html>
